[package]
name = "neatpaste"
version = "0.4.3"
description = "A compact desktop island for local file conversion"
authors = ["NeatPaste contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "neatpaste_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
